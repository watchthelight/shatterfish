//core game code modules
include ':SPD-classes'
include ':core'

//platform modules
// shatterfish-hook:1
//Mobile modules need the Android SDK or Xcode and Shatterfish needs neither, so they move
//behind -Pshatterfish.mobile=on; the same fragment includes the Shatterfish modules.
//Row 1 of docs/UPSTREAM.md.
apply from: 'shatterfish/settings.gradle'
include ':desktop'

//service modules
include ':services'
    //updates
    include ':services:updates:debugUpdates'
    include ':services:updates:githubUpdates'
    //news
    include ':services:news:debugNews'
    include ':services:news:shatteredNews'