site_name: Shatterfish
site_description: An open-source engine for Shattered Pixel Dungeon in the spirit of Stockfish
site_url: https://watchthelight.github.io/shatterfish/
repo_url: https://github.com/watchthelight/shatterfish
repo_name: watchthelight/shatterfish
edit_uri: edit/main/docs/
copyright: >-
  GPL-3.0-or-later. Shatterfish is unofficial and not affiliated with
  Shattered Pixel or Watabou.

docs_dir: docs
site_dir: site

# CI runs `mkdocs build --strict`; every warning below is a failure there.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Files that live in docs/ but are not site pages:
#  - README.md is the GitHub-facing explanation of this docs system (its body is
#    pulled into index.md as a snippet);
#  - the upstream guides are kept verbatim from the pinned tag and link to repo
#    files, so they are served from GitHub instead (see nav);
#  - the rest is tooling.
exclude_docs: |
  README.md
  requirements.in
  requirements.txt
  hooks/
  FUNDING.yml
  PULL_REQUEST_TEMPLATE.md
  getting-started-android.md
  getting-started-desktop.md
  getting-started-ios.md
  recommended-changes.md

hooks:
  - docs/hooks/bmad_artifacts.py

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

nav:
  - Home: index.md
  - Program:
      - Bootstrap prompt: BOOTSTRAP-PROMPT.md
      - Roadmap: roadmap.md
      - Ideas: ideas.md
      - Tooling: tooling.md
  - System:
      - Architecture: architecture.md
      - Fairness: fairness.md
      - Upstream: UPSTREAM.md
      - Codebase map: codebase-map.md
      - Glossary: glossary.md
  - Decisions:
      - adr/index.md
      - ADR-0001 Record architecture decisions: adr/0001-record-architecture-decisions.md
      - ADR-0002 CI shape: adr/0002-ci-shape.md
      - ADR-0003 Module layout: adr/0003-module-layout.md
      - ADR-0004 Documentation system: adr/0004-documentation-system.md
      - ADR-0005 Observation schema and hashing: adr/0005-observation-schema-and-hashing.md
      - ADR-0006 Observer visibility rules: adr/0006-observer-visibility-rules.md
      - ADR-0007 RNG seeding strategy: adr/0007-rng-seeding-strategy.md
      - ADR-0008 Hook guarding and tracking: adr/0008-hook-guarding-and-tracking.md
      - ADR-0009 Snapshot and redetermination: adr/0009-snapshot-restore-and-redetermination.md
      - ADR-0010 Tactical search criteria: adr/0010-tactical-search-deferral-criteria.md
      - ADR-0011 Run-log format: adr/0011-run-log-format.md
      - ADR-0012 Rig statistics: adr/0012-rig-statistics.md
      - ADR-0013 Overlay threading model: adr/0013-overlay-threading-model.md
      - ADR-0014 Action schema: adr/0014-action-schema-and-executor-contract.md
      - ADR-0015 Headless scene and Input waits: adr/0015-headless-scene-and-input-wait-detection.md
  - Rules:
      - rules/index.md
      - Game loop: rules/game-loop.md
      - Visibility: rules/visibility.md
      - Identification: rules/identification.md
      - Combat: rules/combat.md
      - Levels: rules/levels.md
      - Generation: rules/generation.md
      - RNG: rules/rng.md
      - Buffs: rules/buffs.md
      - UI: rules/ui.md
      - Save, score, win: rules/save-score-win.md
      - Text and assets: rules/text-assets.md
  - Codex: codex/index.md
  - Results: results/index.md
  - BMAD artifacts: bmad/index.md
  - Upstream guides (on GitHub):
      - Compiling for desktop: https://github.com/watchthelight/shatterfish/blob/main/docs/getting-started-desktop.md
      - Compiling for Android: https://github.com/watchthelight/shatterfish/blob/main/docs/getting-started-android.md
      - Compiling for iOS: https://github.com/watchthelight/shatterfish/blob/main/docs/getting-started-ios.md
      - Recommended changes: https://github.com/watchthelight/shatterfish/blob/main/docs/recommended-changes.md
