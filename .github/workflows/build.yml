name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build + test (ubuntu, JDK 21)
    runs-on: ubuntu-latest
    steps:
      # Full history, so the pinned upstream tag is present: HooksLedgerTest and
      # HooksVanillaTest compare the tree against it (docs/UPSTREAM.md).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Mobile modules are excluded by default (hook #1, docs/UPSTREAM.md); the
      # ubuntu runner ships an Android SDK, so be explicit that we never want it.
      - name: Build and test all modules
        run: ./gradlew build -Pshatterfish.mobile=off --no-daemon --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shatterfish/*/build/reports/tests/
            shatterfish/*/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
