# The nightly smoke run and its one results pull request (story 3.11, ADR-0002).
#
# Every night: play the smoke set under the standing Registration H-0001-nightly-smoke, record the
# night in results/nightly/history.jsonl, regenerate docs/results/nightly.md, and update ONE pull
# request on the branch rig/nightly -- force-updated, never main, never one pull request per night.
# A night is a direction check, never an acceptance: H-0001 is a baseline and tests nothing.
#
# A failed night is visible without opening a log: its status line is the job summary, the pull
# request's title and body, and the first column of the page; and the job itself goes red.
#
# Network: the checkout, the JDK, Gradle and its dependencies are fetched as in every build; the
# Rig and the recording step make no network call at all, and the only other calls are git and gh
# against GitHub's own API (NFR-8).
name: nightly

on:
  schedule:
    # 04:40 UTC, after the replay job's 04:20.
    - cron: '40 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  smoke:
    name: nightly smoke under H-0001 (a direction check)
    runs-on: ubuntu-latest
    steps:
      # Full history, on main: the Rig asks git whether the Registration is committed and when the
      # Brain last changed, and the results branch is rebuilt on main every night.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: play the smoke set under H-0001
        id: play
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          ./gradlew --no-daemon :rig:run --args="--brain random --seeds smoke --parallel 4 --out build/nightly --registration H-0001-nightly-smoke" 2>&1 | tee build/nightly-play.log

      - name: record the night
        id: record
        if: always()
        shell: bash
        run: |
          set +e
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          ./gradlew -q --no-daemon :rig:nightly --args="$GITHUB_WORKSPACE night build/nightly $(date -u +%F) $(git rev-parse HEAD) $run_url"
          echo "pass=$([ $? -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "## $(cat build/nightly/status.md)"
            echo
            echo "Last lines the Rig printed:"
            echo
            echo '```'
            tail -n 15 build/nightly-play.log 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: update the results pull request
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/nightly-pr.sh

      - name: keep the night's Run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-smoke
          path: build/nightly
          if-no-files-found: ignore
          retention-days: 90

      - name: a failed night fails the job
        if: steps.record.outputs.pass != 'true'
        shell: bash
        run: |
          echo "$(cat build/nightly/status.md 2>/dev/null || echo 'the night could not be recorded')"
          exit 1
