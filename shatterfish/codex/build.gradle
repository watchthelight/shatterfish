// codex: the generator that writes codex/<tag>/*.json from the pinned upstream classes (E2), and
// later the generated docs, the completeness check, the vocabulary diff and the citation checker.
apply from: "$rootDir/shatterfish/java-module.gradle"

dependencies {
    implementation project(':core')
    // The Codex writes api-typed JSON (AD-13); it never hands a game class to the Brain.
    api project(':api')
    // The leak test plays a live Run while it generates, and the seed-free test prepares two
    // Profiles: both come from the harness, on the test classpath only. The generator itself
    // reaches neither the harness nor a Run (CodexLeakTest's gate).
    testImplementation project(':harness')
}

// The tests that boot the game need its assets on the classpath, as the harness's do.
def gameAssets = files(
        new File(project(':core').projectDir, 'src/main/assets'),
        new File(project(':desktop').projectDir, 'src/main/assets'))
sourceSets {
    test {
        runtimeClasspath += gameAssets
    }
}

// The tests compare the committed Codex with a generation from the pinned source and read the
// ledger's pin; Gradle cannot know that from the task graph, and without these inputs a
// hand-edited JSON file, a moved declaration or a re-pinned tag leaves :codex:test UP-TO-DATE.
tasks.named('test') {
    inputs.dir(rootProject.file('codex')).withPropertyName('committedCodex').withPathSensitivity(PathSensitivity.RELATIVE)
    // The generated pages and the nav that must name them (story 2.9): a hand-edited page or a
    // nav entry removed has to rerun these tests, not leave a cached run standing.
    inputs.dir(rootProject.file('docs/codex')).withPropertyName('committedPages').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file('mkdocs.yml')).withPropertyName('siteNav').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file('docs/UPSTREAM.md')).withPropertyName('ledger').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file('build.gradle')).withPropertyName('rootBuildScript').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir(rootProject.file('core/src/main/java')).withPropertyName('pinnedSource').withPathSensitivity(PathSensitivity.RELATIVE)
    // The second pinned source and the pin that names it (story 2.8): the vocabulary diff reads
    // and cites that tree, so a re-pin or a re-fetch has to rerun these tests rather than leave
    // a cached run standing over a tree it never read.
    inputs.file(rootProject.file('vanilla.pin')).withPropertyName('vanillaPin').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir(rootProject.file('vanilla-src')).withPropertyName('vanillaSource').withPathSensitivity(PathSensitivity.RELATIVE)
    // The documentation the citation checker sweeps (story 2.10): every page is an input, so a
    // doc edit reruns the sweep instead of leaving a cached run standing over text it never read.
    inputs.dir(rootProject.file('docs')).withPropertyName('documentation').withPathSensitivity(PathSensitivity.RELATIVE)
}

// `./gradlew :codex:citations` prints the citation report and exits non-zero on a finding: the one
// command the upgrade procedure's re-verification step names (story 2.10). It runs from the test
// classes, where the checker lives, because the Codex's leak gate denies the generator's own
// classes a process and a print stream and that gate is worth more than the placement.
tasks.register('citations', JavaExec) {
    group = 'shatterfish'
    description = 'Resolves every path:line citation in docs/ against the tag the citation names.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.shatterfish.codex.DocsCitations'
    workingDir = rootDir
    args = [rootDir.absolutePath]
    // The documentation elides a path with a Unicode ellipsis, and the report quotes the citation
    // as written. Without this the JVM writes the report in the platform encoding and the
    // elision arrives as a question mark on Windows.
    systemProperty 'stdout.encoding', 'UTF-8'
    systemProperty 'stderr.encoding', 'UTF-8'
    outputs.upToDateWhen { false }
}

// `./gradlew :codex:generate` writes codex/<tag>/ and the site's docs/codex/ pages at the
// repository root: one task, no Run, no seed, on the main classpath, where no harness and no
// libGDX application exist to boot. CI's drift check (story 2.9) reruns it and fails on a
// difference in either folder.
tasks.register('generate', JavaExec) {
    group = 'shatterfish'
    description = 'Writes codex/<tag>/ and docs/codex/ from the pinned upstream classes.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.shatterfish.codex.Generate'
    workingDir = rootDir
    args = [rootDir.absolutePath]
    outputs.upToDateWhen { false }
}
