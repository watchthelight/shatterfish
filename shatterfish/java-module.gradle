// Shared configuration for every Shatterfish module. Applied via
//   apply from: "$rootDir/shatterfish/java-module.gradle"
// so that no upstream build file has to change.
apply plugin: 'java-library'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

ext {
    junitVersion = '5.11.4'
    archunitVersion = '1.5.0'
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
}

// Local variable tables in every class: the monitor rule of story 1.19 types a monitor's operand
// through them, and Gradle's default of -g is a default, not a promise.
tasks.withType(JavaCompile).configureEach {
    options.debugOptions.debugLevel = 'source,lines,vars'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Test classes run in forked JVMs side by side: half the cores, at most 4 (2 on a 4-core CI
    // runner). Each fork is its own JVM, so the game's static state is never shared between two
    // classes running at once. Override with -Pshatterfish.testForks=N, 1 for the old serial run.
    def forks = project.findProperty('shatterfish.testForks')
    maxParallelForks = forks != null ? (forks as int)
            : Math.max(1, Math.min(4, Runtime.runtime.availableProcessors().intdiv(2)))
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}
