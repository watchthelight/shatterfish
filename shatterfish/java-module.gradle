// Shared configuration for every Shatterfish module. Applied via
//   apply from: "$rootDir/shatterfish/java-module.gradle"
// so that no upstream build file has to change.
apply plugin: 'java-library'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

ext {
    junitVersion = '5.11.4'
    archunitVersion = '1.5.0'
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}
