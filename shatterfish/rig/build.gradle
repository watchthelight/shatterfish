// rig: parallel runner, seed sets, SPRT, run logs, replay.
apply from: "$rootDir/shatterfish/java-module.gradle"

dependencies {
    implementation project(':harness')
    implementation project(':brain')
    // A Seed set is an api value with a schema version of its own (AD-13, ADR-0018), written by
    // the canonical writer in api. It already arrives through the harness, which exposes api as
    // part of its own interface; it is declared here because the rig uses it directly and a
    // module should not depend on what another module happens to re-export.
    implementation project(':api')
}

// The Seed set drift check reads the committed seeds/ and compares it with a fresh derivation, and
// Gradle cannot know that from the task graph. Without this input a hand-edited set leaves
// :rig:test UP-TO-DATE and the check simply does not run: the build stays green because nothing
// looked. This is the declaration the Codex's own test needed for the same reason.
tasks.named('test') {
    inputs.dir(rootProject.file('seeds')).withPropertyName('committedSeedSets').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir(rootProject.file('reference')).withPropertyName('referenceRun').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file('.github/workflows/replay.yml')).withPropertyName('replayWorkflow').withPathSensitivity(PathSensitivity.RELATIVE)
    // The committed Registrations and the comparison ledger, for the same reason as the seed sets
    // above: RegistrationsTest and LedgerTest hold the real files, and without this a hand-edited
    // Registration or a shortened ledger leaves those checks UP-TO-DATE and they do not run.
    inputs.dir(rootProject.file('registrations')).withPropertyName('committedRegistrations').withPathSensitivity(PathSensitivity.RELATIVE)
    // The calibration table and the page generated from it (story 3.7): CalibrationTest renders the
    // page afresh and compares it with the committed one.
    inputs.dir(rootProject.file('calibration')).withPropertyName('calibrationTables').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file('docs/results/calibration-v4.0.0.md')).withPropertyName('calibrationPage').withPathSensitivity(PathSensitivity.RELATIVE)
    // RunnerTest and CalibrationTest hold the commands the methodology page publishes; without this
    // an edit to the page alone leaves :rig:test UP-TO-DATE and neither check runs.
    inputs.file(rootProject.file('docs/methodology.md')).withPropertyName('methodologyPage').withPathSensitivity(PathSensitivity.RELATIVE)
}

// `./gradlew :rig:gallery --args="<folder> [--snapshots N]"` writes gallery.md for a folder the Rig
// wrote -- the Runner already writes one after every invocation -- and with --snapshots the last N
// waits of every Run into snapshots/ (story 3.12, FR-26).
tasks.register('gallery', JavaExec) {
    group = 'shatterfish'
    description = 'Writes the death gallery for a folder the Rig wrote.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.shatterfish.rig.Gallery'
    workingDir = rootDir
    outputs.upToDateWhen { false }
}

// `./gradlew :rig:calibrate` writes docs/results/calibration-v4.0.0.md from the committed table in
// calibration/ (story 3.7). With `--args="<root> extract <runs folder>"` it writes the table from a
// folder the Rig wrote instead. Nothing is played: the simulation bootstraps the table's outcomes.
tasks.register('calibrate', JavaExec) {
    group = 'shatterfish'
    description = 'Calibrates the sequential test on committed outcomes and writes its results page.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.shatterfish.rig.Calibration'
    workingDir = rootDir
    args = [rootDir.absolutePath]
    outputs.upToDateWhen { false }
}

// `./gradlew :rig:seeds` writes seeds/ at the repository root: one task, no Run, no game boot,
// nothing drawn. CI's drift check (SeedSetsTest) reruns the derivation and fails on a difference.
tasks.register('seeds', JavaExec) {
    group = 'shatterfish'
    description = 'Writes seeds/ from the derivation in SeedSets.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.shatterfish.rig.Seeds'
    workingDir = rootDir
    args = [rootDir.absolutePath]
    outputs.upToDateWhen { false }
}

// `./gradlew :rig:reference` writes the committed reference Run: one log and the index that
// publishes its chain. The nightly cross-platform workflow replays it on Windows and on Linux.
// The tuple and the reason for every part of it are in Reference itself, so that the values are
// stated once, in Java, where a test can hold the committed file against them.
tasks.register('reference', JavaExec) {
    group = 'shatterfish'
    description = 'Writes reference/ : one Run, fixed in every part, for the cross-platform replay.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.shatterfish.rig.Reference'
    workingDir = rootDir
    args = [new File(rootDir, 'reference').absolutePath]
    outputs.upToDateWhen { false }
}

// The game reads its message bundles, atlases and sounds from the classpath through Gdx.files,
// and core/src/main/assets is not a resources dir, so Gradle does not put it there (the harness's
// own build does the same thing, for the same reason). The rig needs them on *its* classpath
// because it hands that classpath to the child processes it starts: a child inherits
// java.class.path from this process, so an asset the rig cannot see is an asset no Run can read.
// The first invocation of the runner failed exactly there, with every Run dying in Messages.setup.
def gameAssets = files(
        new File(project(':core').projectDir, 'src/main/assets'),
        new File(project(':desktop').projectDir, 'src/main/assets'))
sourceSets {
    main {
        runtimeClasspath += gameAssets
    }
    test {
        runtimeClasspath += gameAssets
    }
}

// `./gradlew :rig:run --args=""--brain random --seeds smoke --parallel 4 --out <dir>"` (story 3.3).
// The runner plays nothing itself: it starts one child JVM per Run, because the game's state is
// static and process-wide (AD-6). The children inherit this task's classpath.
tasks.register('run', JavaExec) {
    group = 'shatterfish'
    description = 'Runs a Brain over a Seed set, one process per Run.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.shatterfish.rig.Runner'
    workingDir = rootDir
    outputs.upToDateWhen { false }
}
