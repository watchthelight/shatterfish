// rig: parallel runner, seed sets, SPRT, run logs, replay.
apply from: "$rootDir/shatterfish/java-module.gradle"

dependencies {
    implementation project(':harness')
    implementation project(':brain')
    // A Seed set is an api value with a schema version of its own (AD-13, ADR-0018), written by
    // the canonical writer in api. It already arrives through the harness, which exposes api as
    // part of its own interface; it is declared here because the rig uses it directly and a
    // module should not depend on what another module happens to re-export.
    implementation project(':api')
}

// The Seed set drift check reads the committed seeds/ and compares it with a fresh derivation, and
// Gradle cannot know that from the task graph. Without this input a hand-edited set leaves
// :rig:test UP-TO-DATE and the check simply does not run: the build stays green because nothing
// looked. This is the declaration the Codex's own test needed for the same reason.
tasks.named('test') {
    inputs.dir(rootProject.file('seeds')).withPropertyName('committedSeedSets').withPathSensitivity(PathSensitivity.RELATIVE)
}

// `./gradlew :rig:seeds` writes seeds/ at the repository root: one task, no Run, no game boot,
// nothing drawn. CI's drift check (SeedSetsTest) reruns the derivation and fails on a difference.
tasks.register('seeds', JavaExec) {
    group = 'shatterfish'
    description = 'Writes seeds/ from the derivation in SeedSets.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.shatterfish.rig.Seeds'
    workingDir = rootDir
    args = [rootDir.absolutePath]
    outputs.upToDateWhen { false }
}

// `./gradlew :rig:reference` writes the committed reference log at reference/. It is one Run of a
// fixed tuple under a fixed salt and a fixed cap, played by the random Brain, whose only job is to
// be replayed: the nightly cross-platform workflow replays it on Windows and on Linux, and a
// difference between the two is a difference this project finds rather than a reader.
//
// Its attested commit is forty zeros on purpose. A real commit would change every time the file was
// regenerated and would say nothing true about the build that replays it -- the log's job here is
// to be the same bytes on every machine, which is exactly what the chain is over.
tasks.register('reference', JavaExec) {
    group = 'shatterfish'
    description = 'Writes reference/ : one Run, fixed in every part, for the cross-platform replay.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.shatterfish.rig.RunOne'
    workingDir = rootDir
    args = ['--seed', '12648430', '--class', 'WARRIOR', '--challenges', '0',
            '--salt', '1511527447', '--cap', '400', '--brain', 'random',
            '--brain-commit', '0000000000000000000000000000000000000000',
            '--commit', '0000000000000000000000000000000000000000',
            '--machine', 'the reference', '--registration', '',
            '--out', new File(rootDir, 'reference').absolutePath]
    outputs.upToDateWhen { false }
}

// The game reads its message bundles, atlases and sounds from the classpath through Gdx.files,
// and core/src/main/assets is not a resources dir, so Gradle does not put it there (the harness's
// own build does the same thing, for the same reason). The rig needs them on *its* classpath
// because it hands that classpath to the child processes it starts: a child inherits
// java.class.path from this process, so an asset the rig cannot see is an asset no Run can read.
// The first invocation of the runner failed exactly there, with every Run dying in Messages.setup.
def gameAssets = files(
        new File(project(':core').projectDir, 'src/main/assets'),
        new File(project(':desktop').projectDir, 'src/main/assets'))
sourceSets {
    main {
        runtimeClasspath += gameAssets
    }
    test {
        runtimeClasspath += gameAssets
    }
}

// `./gradlew :rig:run --args=""--brain random --seeds smoke --parallel 4 --out <dir>"` (story 3.3).
// The runner plays nothing itself: it starts one child JVM per Run, because the game's state is
// static and process-wide (AD-6). The children inherit this task's classpath.
tasks.register('run', JavaExec) {
    group = 'shatterfish'
    description = 'Runs a Brain over a Seed set, one process per Run.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.shatterfish.rig.Runner'
    workingDir = rootDir
    outputs.upToDateWhen { false }
}
